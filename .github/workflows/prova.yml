# Prova automatica su macOS (Apple Silicon), Windows e Linux:
# installa gli strumenti con setup.py, compila ed esegue l'esempio nell'emulatore e controlla
# il Serial Monitor; su macOS/Linux verifica anche che Renode si chiuda se il server muore.
name: prova

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banco:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest    # Apple Silicon
            python: "3.11"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.9"       # versione minima supportata (quella degli strumenti Apple sui Mac)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Cache degli strumenti
        uses: actions/cache@v6
        with:
          path: tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('setup.py') }}

      - name: Installazione strumenti (setup.py)
        run: python setup.py

      - name: Compila ed esegue l'esempio
        shell: bash
        run: |
          set +e
          python -I server/selftest.py examples/ciao_zybo.c 4 "1.0:sw 0 1;2.0:btn 1 1" \
            --expect "Ciao dalla Zybo Z7-10!" --expect "SW = 0x1  BTN = 0x2" > selftest.log 2>&1
          rc=$?
          cat selftest.log
          if [ $rc -ne 0 ]; then
            # le ultime righe come annotazione, leggibile anche senza scaricare i log
            msg=$(tail -n 60 selftest.log | cut -c1-200 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=selftest::${msg}"
          fi
          exit $rc

      - name: Percorso audio del Lab 3 (codec, FIFO, tempo CPU)
        shell: bash
        run: |
          set +e
          python -I server/selftest.py examples/audio_passthrough.c 30 --input "sine 1000 -12" \
            --expect "passthrough attivo" --expect "picco -12 dBFS  FIFO piena 0 volte" > audio.log 2>&1
          rc=$?
          cat audio.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 60 audio.log | cut -c1-200 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=audio::${msg}"
          fi
          exit $rc

      - name: Programmi sbagliati (Data Abort, codec non attivo)
        shell: bash
        run: |
          set +e
          python -I server/selftest.py tests/pl_data_abort.c 6 --expect "prima dell'accesso" \
            --expect-not "dopo l'accesso" --expect-abort > wrong.log 2>&1
          rc1=$?
          python -I server/selftest.py tests/codec_inactive.c 30 --input "sine 1000 -12" \
            --expect "picco con codec non attivo: zero" >> wrong.log 2>&1
          rc2=$?
          python -I server/selftest.py tests/data_abort_handler.c 6 \
            --expect "gestore: DFSR 0x008 DFAR 0x43C30000 istruzione giusta" --expect-not "dopo l'accesso" >> wrong.log 2>&1
          rc3=$?
          cat wrong.log
          if [ $rc1 -ne 0 ] || [ $rc2 -ne 0 ] || [ $rc3 -ne 0 ]; then
            msg=$(tail -n 60 wrong.log | cut -c1-200 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=sbagliati::${msg}"
            exit 1
          fi

      - name: Cache, PMU e audio reale (WAV su LINE IN)
        shell: bash
        run: |
          set +e
          python -I tests/make_tone_wav.py tone.wav
          python -I server/selftest.py examples/audio_passthrough.c 20 --input "file tone.wav" \
            --expect "picco -6 dBFS  FIFO piena 0 volte" > perf.log 2>&1
          rc1=$?
          python -I server/selftest.py tests/cache_pmu.c 90 --expect "VERIFICA CACHE OK" >> perf.log 2>&1
          rc2=$?
          cat perf.log
          if [ $rc1 -ne 0 ] || [ $rc2 -ne 0 ]; then
            msg=$(tail -n 60 perf.log | cut -c1-200 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cache-wav::${msg}"
            exit 1
          fi

      - name: Server web e chiusura di Renode (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -I server/app.py --no-browser > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/status | grep -q '"idle"' && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/api/status
          curl -sf http://127.0.0.1:8765/ | grep -q labsDirBtn
          pgrep -f "tools/renode" > /dev/null || { echo "Renode non partito"; cat server.log; exit 1; }
          kill -9 $PID                                   # il server muore di colpo...
          sleep 6
          if pgrep -f "tools/renode" > /dev/null; then   # ...Renode deve chiudersi da solo
            echo "ERRORE: Renode e' rimasto acceso"; exit 1
          fi
          echo "OK: Renode chiuso dal guardiano"
